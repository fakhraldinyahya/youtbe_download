<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنزيل فيديوهات يوتيوب</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen bg-white dark:bg-gray-900 transition-colors duration-200">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">تنزيل فيديوهات يوتيوب</h1>
            <p class="text-gray-600 dark:text-gray-300">أدخل رابط فيديو يوتيوب لتنزيله</p>
        </header>
        
        <div class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
            <div class="p-6">
                <div class="mb-4">
                    <label for="youtubeUrl" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">رابط يوتيوب</label>
                    <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." 
                        class="w-full px-4 py-2 text-base border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-primary dark:bg-gray-700 dark:text-white">
                </div>
                
                <div class="mb-4">
                    <label for="quality" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">جودة الفيديو</label>
                    <select id="quality" class="w-full px-4 py-2 text-base border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-primary dark:bg-gray-700 dark:text-white">
                        <option value="highest">أعلى جودة</option>
                        <!-- سيتم ملء الخيارات الأخرى بواسطة JavaScript -->
                    </select>
                </div>
                
                <button id="infoBtn" class="w-full bg-primary hover:bg-opacity-90 text-white font-medium py-2 px-4 rounded-md transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary mb-2">
                    عرض معلومات الفيديو
                </button>

                <button id="downloadBtn" class="w-full bg-green-600 hover:bg-opacity-90 text-white font-medium py-2 px-4 rounded-md transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-600 hidden">
                    تنزيل الفيديو
                </button>
            </div>
        </div>
        
        <div id="result" class="mt-8 max-w-md mx-auto hidden">
            <div id="loading" class="flex flex-col items-center justify-center py-4">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
                <h2 id="loadingText" class="text-center text-gray-700 dark:text-gray-300">جاري معالجة طلبك...</h2>
            </div>
            
            <div id="errorMessage" class="bg-red-100 border-r-4 border-red-500 text-red-700 p-4 dark:bg-red-900 dark:text-red-200 hidden" role="alert">
                <p class="font-bold">خطأ</p>
                <p id="errorText"></p>
            </div>
            
            <div id="successMessage" class="bg-green-100 border-r-4 border-green-500 text-green-700 p-4 dark:bg-green-900 dark:text-green-200 hidden" role="alert">
                <p class="font-bold">نجاح</p>
                <p id="successText"></p>
            </div>
        </div>
        
        <div id="videoInfo" class="mt-8 max-w-md mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden hidden">
            <div class="p-6">
                <h2 id="videoTitle" class="text-xl font-semibold text-gray-800 dark:text-white mb-2"></h2>
                <div id="videoThumbnail" class="w-full aspect-video bg-gray-200 dark:bg-gray-700 mb-4 rounded overflow-hidden"></div>
                <div id="videoDetails" class="text-sm text-gray-600 dark:text-gray-400"></div>
                <div id="downloadLink" class="mt-4"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script1.js') }}"></script>
</body>
</html>
